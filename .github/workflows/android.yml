name: Android app

# Builds mobile/ into TrustVault.apk. Pushing a tag such as app-v1.0 also publishes it as a GitHub release.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION: ${{ startsWith(github.ref_name, 'app-v') && github.ref_name || '0.0.0-test' }}
      # Optional: a base64 keystore (alias and passwords "trustvault"). Without it the APK is signed with a throwaway debug key.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: |
          export APP_VERSION="${APP_VERSION#app-v}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            sh gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password=trustvault \
              -Pandroid.injected.signing.key.alias=trustvault \
              -Pandroid.injected.signing.key.password=trustvault
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TrustVault.apk"
          else
            sh gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TrustVault.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TrustVault-apk
          path: TrustVault.apk
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/app-v')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" TrustVault.apk --title "TrustVault for Android ${GITHUB_REF_NAME#app-v}" \
            --notes "Download **TrustVault.apk** on an Android phone and tap it to install. Android asks once to allow installing from your browser. The app opens the live site, so it needs an internet connection." \
            || gh release upload "$GITHUB_REF_NAME" TrustVault.apk --clobber
